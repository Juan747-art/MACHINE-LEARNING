<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Machine Learning Dashboard</title>

<style>

body{
    font-family: Arial;
    background-color:#f4f6f9;
    margin:0;
}

.header{
    background:#2c3e50;
    color:white;
    padding:20px;
    font-size:24px;
    text-align:center;
}

.container{
    padding:40px;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.ml-result{
    font-size:40px;
    color:#27ae60;
}

.grid{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:20px;
}

.stat{
    font-size:28px;
    font-weight:bold;
}

.menu{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:15px;
    margin-top:20px;
}

.btn{
    padding:12px;
    font-size:14px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    transition:0.3s;
    width:100%;
}

.linear{
    background:#27ae60;
    color:white;
}

.linear:hover{
    background:#1e8449;
}

.predict{
    background:#2980b9;
    color:white;
}

.predict:hover{
    background:#1f618d;
}

.usecase{
    background:#8e44ad;
    color:white;
}

.usecase:hover{
    background:#6c3483;
}

.case{
    background:#9b59b6;
    color:white;
}

.case:hover{
    background:#7d3c98;
}

.supervised{
    background:#16a085;
    color:white;
}

.supervised:hover{
    background:#117864;
}

.basic{
    background:#f39c12;
    color:white;
}

.basic:hover{
    background:#d68910;
}

.app{
    background:#34495e;
    color:white;
}

.app:hover{
    background:#2c3e50;
}

</style>

</head>

<body>

<div class="header">
Machine Learning Dashboard
</div>

<div class="container">

<div class="card">
<h2>Welcome to your dashboard</h2>
<p>This system demonstrates Machine Learning use cases.</p>
</div>

<div class="card">
<h2>ML Prediction</h2>
<p>Predicted success probability:</p>

<div class="ml-result">
{{prediction}} %
</div>
</div>

<div class="grid">

<div class="card">
<h3>Users Analyzed</h3>
<div class="stat">1240</div>
</div>

<div class="card">
<h3>Model Accuracy</h3>
<div class="stat">91%</div>
</div>

<div class="card">
<h3>Predictions Today</h3>
<div class="stat">342</div>
</div>

</div>

<div class="card">

<h2>Main Menu</h2>

<div class="menu">

<a href="/ml-use-cases"><button class="btn usecase">ML Use Cases</button></a>

<a href="/use-case-1"><button class="btn case">Use Case 1</button></a>

<a href="/use-case-2"><button class="btn case">Use Case 2</button></a>

<a href="/use-case-3"><button class="btn case">Use Case 3</button></a>

<a href="/use-case-4"><button class="btn case">Use Case 4</button></a>

<a href="/supervised-ml"><button class="btn supervised">Supervised ML</button></a>

<a href="/linear-regression"><button class="btn linear">Linear Regression</button></a>

<a href="/linear-concepts">
<button class="btn linear">Linear Regression Concepts</button>
</a>

<a href="/application"><button class="btn app">Application</button></a>

<a href="/linear-exercise"><button class="btn linear">Linear Regression Exercise</button></a>

<a href="/predict-exercise"><button class="btn predict">Predict Exercise</button></a>

</div>

</div>

</div>

</body>
</html>
