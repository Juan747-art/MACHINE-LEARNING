<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<title>Machine Learning Dashboard</title>

<style>

body{
    font-family: Arial;
    background-color:#f4f6f9;
    margin:0;
}

.header{
    background:#2c3e50;
    color:white;
    padding:20px;
    font-size:24px;
    text-align:center;
}

.container{
    padding:40px;
}

.card{
    background:white;
    padding:25px;
    margin-bottom:20px;
    border-radius:10px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.ml-result{
    font-size:40px;
    color:#27ae60;
}

.grid{
    display:grid;
    grid-template-columns: repeat(3,1fr);
    gap:20px;
}

.stat{
    font-size:28px;
    font-weight:bold;
}

.btn{
    padding:12px 25px;
    font-size:16px;
    border:none;
    border-radius:8px;
    cursor:pointer;
    margin-right:10px;
    transition:0.3s;
}

.linear{
    background:#27ae60;
    color:white;
}

.linear:hover{
    background:#1e8449;
}

.logistic{
    background:#2980b9;
    color:white;
}

.logistic:hover{
    background:#1f618d;
}

</style>

</head>

<body>

<div class="header">
Machine Learning Dashboard
</div>

<div class="container">


<div class="card">
<h2>Welcome to your dashboard</h2>
<p>This system demonstrates a Machine Learning prediction using Linear and Logistic Regression.</p>
</div>

<div class="card">
<h2>ML Prediction</h2>
<p>Predicted success probability:</p>

<div class="ml-result">
{{prediction}} %
</div>
</div>

<!-- Stats -->
<div class="grid">

<div class="card">
<h3>Users Analyzed</h3>
<div class="stat">1240</div>
</div>

<div class="card">
<h3>Model Accuracy</h3>
<div class="stat">91%</div>
</div>

<div class="card">
<h3>Predictions Today</h3>
<div class="stat">342</div>
</div>

</div>

<div class="card">

<h2>Select Model</h2>

<div style="margin-top:20px;">

    <!-- Linear Regression -->
    <a href="/linear-regression">
        <button class="btn linear">Linear Regression</button>
    </a>

    <!-- Logistic Regression -->
    <a href="/predict-logistic">
        <button class="btn logistic">Logistic Regression</button>
    </a>

</div>

</div>

</div>

</body>
</html>
