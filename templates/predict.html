<!DOCTYPE html>
<html>
<head>
<title>Predict Grade</title>

<style>

body{
    font-family: Arial;
    background:#f4f6f9;
    margin:0;
}

.container{
    padding:40px;
}

.card{
    background:white;
    padding:25px;
    border-radius:10px;
    width:400px;
    margin:auto;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

input{
    width:100%;
    padding:10px;
    margin-top:10px;
}

button{
    margin-top:15px;
    padding:10px;
    width:100%;
    background:#27ae60;
    color:white;
    border:none;
    border-radius:5px;
}

.result{
    font-size:28px;
    color:#27ae60;
    margin-top:20px;
}

</style>
</head>

<body>

<div class="container">

<div class="card">

<h2>Predict Final Grade</h2>

<form method="POST">

<label>Study Hours</label>
<input type="number" step="0.1" name="hours" required>

<button type="submit">Predict</button>

</form>

{% if result %}
<div class="result">
Predicted Grade: {{result}}
</div>
{% endif %}

</div>

</div>

</body>
</html>
